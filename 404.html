<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada | Dra. Thaiany B. Benito</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF7F1; --sand:#F2EADF; --esp:#2B201B; --brown:#795331;
  --gold:#B89565; --gold2:#D9C3A0; --ink:#3A2E28; --muted:#7A6D64;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font:400 16px/1.7 Manrope,system-ui,sans-serif;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center;
}
.box{
  max-width:540px;
  padding:48px 32px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 20px 40px -20px rgba(43,32,27,.25);
}
.mono{
  width:56px;
  height:56px;
  border-radius:50%;
  border:1px solid var(--gold);
  display:grid;
  place-items:center;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:24px;
  color:var(--brown);
  font-style:italic;
  margin:0 auto 24px;
}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:500;
  font-size: clamp(38px, 6vw, 56px);
  color:var(--esp);
  line-height:1.1;
  margin-bottom:12px;
}
p{
  color:var(--muted);
  font-size:16px;
  margin-bottom:32px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:15px 28px;
  border-radius:100px;
  font-weight:600;
  font-size:15px;
  text-decoration:none;
  background:var(--esp);
  color:#fff;
  transition:.3s;
}
.btn:hover{
  background:var(--brown);
  transform:translateY(-2px);
}
</style>
</head>
<body>
  <div class="box">
    <div class="mono">TB</div>
    <h1>Página não encontrada</h1>
    <p>O link que você tentou acessar não existe ou foi alterado.</p>
    <a href="./" class="btn">Voltar à página inicial</a>
  </div>
</body>
</html>
